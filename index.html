<!-- dados: fichas do quiz (mesma fonte do quiz), ficha completa da raça, conteúdo do app -->
<script>
// O quiz mora em outro domínio (vovocao.vercel.app): ele manda o cadastro no link (?perfil=base64). Aqui ele vira o localStorage do contrato.
(function () { try { var m = location.search.match(/[?&]perfil=([^&]+)/); if (!m) return;
  var b = decodeURIComponent(m[1]).replace(/-/g, "+").replace(/_/g, "/"); var j = decodeURIComponent(escape(atob(b))); JSON.parse(j);
  localStorage.setItem("maisanos:perfil", j); history.replaceState(null, "", location.pathname + location.hash); } catch (e) {} })();
</script>
